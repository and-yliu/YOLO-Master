# P2 VOC｜现有 F13 SigLIP2 positive-region semantic KD（不叠加 dense P4 KD）
# semantic 权重 1.0 仅供训练数据梯度标定，正式训练必须由 run_p2.py 注入已冻结权重。
model: ultralytics/cfg/models/26/yolo26-master-n.yaml
data: VOC.yaml
task: detect
mode: train

epochs: 400
imgsz: 256
batch: 64
workers: 32
optimizer: SGD
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
pretrained: false
amp: false

seed: 17
deterministic: true

val: true
plots: true
save: true
project: d2/p2voc
name: siglip_semantic-s17

foundation_enabled: true
foundation_teacher: siglip2
foundation_model: google/siglip2-base-patch16-256
foundation_loss_weight: 0.0
foundation_backend: transformers
foundation_target_levels: [p4]
foundation_multiscale: false
foundation_align_dim: 256
foundation_loss: relational
foundation_foreground_weighting: false
foundation_weight_schedule: constant
foundation_router_distill: false
foundation_router_loss_weight: 0.0
foundation_semantic_distill: true
foundation_semantic_loss_weight: 1.0
foundation_semantic_text_weight: 1.0
foundation_semantic_image_weight: 1.0
foundation_semantic_temperature: 0.07
