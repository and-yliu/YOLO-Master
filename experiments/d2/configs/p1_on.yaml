# D2 P1 处理组（treatment）。
# 与 p1_off.yaml 的差异必须且仅限于本文件末尾 "唯一变量" 区块内的字段。
# 其余每一行都应与 p1_off.yaml 逐字相同——改动任何一行都会使这一配对失效。
model: ultralytics/cfg/models/26/yolo26-master-n.yaml
data: coco128.yaml
task: detect
mode: train

# ---- 预算与优化：on/off 必须完全一致 ----
epochs: 10
imgsz: 256
batch: 4
workers: 0
optimizer: SGD
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
pretrained: false
amp: false

# ---- 可复现性 ----
seed: 17
deterministic: true

# ---- 评测与产物 ----
val: true
plots: false
save: true
project: runs/d2/p1
name: on-s17

# ---- 唯一变量：Foundation 蒸馏开关 ----
foundation_enabled: true
foundation_teacher: dinov3
foundation_model: facebook/dinov3-vits16-pretrain-lvd1689m
foundation_loss_weight: 0.05

# 以下字段在 off 组中不生效（loss_weight=0 时教师不参与计算），
# 但仍显式写出，以便配对差异一目了然、可被逐字段核对。
foundation_backend: transformers
foundation_target_levels: [p4]
foundation_align_dim: 64
foundation_loss: cosine
foundation_multiscale: false
foundation_foreground_weighting: false
foundation_weight_schedule: constant
