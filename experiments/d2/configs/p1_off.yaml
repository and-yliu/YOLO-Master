# D2 P1 对照组（baseline）。
# 与 p1_on.yaml 的差异必须且仅限于本文件末尾 "唯一变量" 区块内的字段。
# 其余每一行都应与 p1_on.yaml 逐字相同——改动任何一行都会使这一配对失效。
model: ultralytics/cfg/models/26/yolo26-master-n.yaml
data: coco128.yaml
task: detect
mode: train

# ---- 预算与优化：on/off 必须完全一致 ----
epochs: 10
imgsz: 256
batch: 4
workers: 0
optimizer: SGD
lr0: 0.01
lrf: 0.01
warmup_epochs: 3.0
pretrained: false
amp: false

# ---- 可复现性 ----
seed: 17
deterministic: true

# ---- 评测与产物 ----
val: true
plots: false
save: true
project: runs/d2/p1
name: off-s17

# ---- 唯一变量：Foundation 蒸馏开关 ----
foundation_enabled: false
foundation_teacher: none
foundation_model:
foundation_loss_weight: 0.0
